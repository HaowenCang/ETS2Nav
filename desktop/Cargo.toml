[package]
name = "ets2nav-desktop"
version = "0.7.0-rc.1"
edition = "2021"

[features]
# 默认关闭：发布产物不含任何故障注入代码（由 assemble-bundle.ps1 字节扫描强制）。
# 打开后可在 **release** 配置下注入作业对象失败，用于证明 release 的 fail-closed 判据
# 真的被执行，而不是仅由阅读代码推断（P4R Batch 6B §4）。
default = []
fault-inject = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

# P4R Batch 6A §8：作业对象（KILL_ON_JOB_CLOSE）与进程句柄。
# 只声明本目标平台，避免在其它平台上引入无用的编译单元。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
